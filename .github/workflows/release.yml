name: GlowLang Release

# Builds glowlang and gdu for Windows, Linux and macOS (Intel and Apple
# silicon), runs the test suite on each, packages them with the standard
# library, and publishes a release to anshumali19/GlowLang-packages.
#
#   Publish:  git tag v1.3.0 && git push origin v1.3.0
#   Check:    a push that changes this file builds and tests everything,
#             without publishing.
#
# Publishing needs the RELEASE_TOKEN secret: a token with "contents: write"
# on GlowLang-packages.

on:
  push:
    tags: ['v*']
    branches: ['**']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a release (needs a tag name below)'
        type: boolean
        default: false
      tag:
        description: 'Release tag, e.g. v1.3.0'
        required: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      SIGNING_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-22.04        # older glibc: runs on more distributions
          - target: macos-x64
            os: macos-15-intel      # Intel
          - target: macos-arm64
            os: macos-15            # Apple silicon (macos-14 retires 2026-11-02)
          - target: windows-x64
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      # `glowlang --version` must match the release: tag v1.6.0 needs
      # GLOWLANG_VERSION "1.6.0" in src/version.h.
      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(tr -d '\r' < src/version.h | sed -n 's/^#define GLOWLANG_VERSION "\(.*\)"/\1/p')
          if [ "$have" != "$want" ]; then
            echo "::error::src/version.h says $have but the tag is $GITHUB_REF_NAME; bump GLOWLANG_VERSION to $want first"
            exit 1
          fi

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libsqlite3-dev libssl-dev libx11-dev gcc cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 flex bison coreutils
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install winflexbison3 --no-progress
          vcpkg install openssl:x64-windows-static sqlite3:x64-windows-static

      # OpenSSL is linked statically so the binaries do not need it installed.
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=TRUE
          cmake --build build --config Release --parallel

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DOPENSSL_USE_STATIC_LIBS=TRUE \
                -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          cmake --build build --config Release --parallel

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
          cmake --build build --config Release --parallel

      # Sign glowlang.exe and gdu.exe with Azure Artifact Signing (formerly
      # Trusted Signing) so Windows (SmartScreen, Smart App Control) trusts the
      # downloads. Skipped, and the release ships unsigned, until the AZURE_*
      # secrets and TRUSTED_SIGNING_* variables are set (see
      # docs/release_signing.md). Signing comes before the tests, so the tests
      # run the signed binaries. This calls Microsoft's ArtifactSigning module
      # directly, because the repository allows only GitHub's own actions.
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.SIGNING_CLIENT_ID != ''
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          Install-Module -Name ArtifactSigning -RequiredVersion 0.1.8 -Force -Scope CurrentUser -Repository PSGallery
          $params = @{
            Endpoint               = '${{ vars.TRUSTED_SIGNING_ENDPOINT }}'
            CodeSigningAccountName = '${{ vars.TRUSTED_SIGNING_ACCOUNT }}'
            CertificateProfileName = '${{ vars.TRUSTED_SIGNING_PROFILE }}'
            FilesFolder            = "$env:GITHUB_WORKSPACE\bin\Release"
            FilesFolderFilter      = 'exe'
            FileDigest             = 'SHA256'
            TimestampRfc3161       = 'http://timestamp.acs.microsoft.com'
            TimestampDigest        = 'SHA256'
          }
          Invoke-ArtifactSigning @params

      - name: Check signature (Windows)
        if: runner.os == 'Windows' && env.SIGNING_CLIENT_ID != ''
        run: |
          foreach ($exe in 'bin\Release\glowlang.exe', 'bin\Release\gdu.exe') {
            $sig = Get-AuthenticodeSignature $exe
            Write-Output "$exe : $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$exe signature is $($sig.Status)" }
          }

      - name: Unsigned build notice (Windows)
        if: runner.os == 'Windows' && env.SIGNING_CLIENT_ID == ''
        run: Write-Output "::warning::Windows binaries are not signed (signing secrets not set)"

      - name: Test (Linux/macOS)
        if: runner.os != 'Windows'
        run: GLOWLANG_BIN=./bin/glowlang ./scripts/run-tests.sh

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: .\scripts\run-tests.ps1 -Binary bin\Release\glowlang.exe

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/glowlang
          cp bin/glowlang bin/gdu dist/glowlang/
          cp -R lib dist/glowlang/lib
          cp LICENSE NOTICE dist/glowlang/
          printf 'GlowLang %s (%s)\n\nRun programs with: ./glowlang run app.glow\nInstall packages with: ./gdu install <name>\nThe lib/ folder holds the standard GlowLang libraries; keep it next to glowlang.\n' \
            "${GITHUB_REF_NAME}" "${{ matrix.target }}" > dist/glowlang/README.txt
          tar -czf glowlang-${{ matrix.target }}.tar.gz -C dist/glowlang .
          # Run the packaged copy from outside the repository, so imports must
          # come from the lib/ shipped beside it.
          mkdir -p "$RUNNER_TEMP/smoke" && cp scripts/release-smoke.glow "$RUNNER_TEMP/smoke/app.glow"
          (cd "$RUNNER_TEMP/smoke" && "$GITHUB_WORKSPACE/dist/glowlang/glowlang" run app.glow > out.txt)
          diff scripts/release-smoke.out "$RUNNER_TEMP/smoke/out.txt"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force dist\glowlang | Out-Null
          Copy-Item bin\Release\glowlang.exe, bin\Release\gdu.exe dist\glowlang\
          Copy-Item -Recurse lib dist\glowlang\lib
          Copy-Item LICENSE, NOTICE dist\glowlang\
          "GlowLang $env:GITHUB_REF_NAME (${{ matrix.target }})`r`n`r`nRun programs with: glowlang run app.glow`r`nInstall packages with: gdu install <name>`r`nThe lib\ folder holds the standard GlowLang libraries; keep it next to glowlang.exe.`r`n" | Set-Content dist\glowlang\README.txt
          Compress-Archive -Path dist\glowlang\* -DestinationPath glowlang-${{ matrix.target }}.zip
          # Run the packaged copy from outside the repository, so imports must
          # come from the lib\ shipped beside it.
          $smoke = Join-Path $env:RUNNER_TEMP smoke
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item scripts\release-smoke.glow "$smoke\app.glow"
          Push-Location $smoke
          $out = & "$env:GITHUB_WORKSPACE\dist\glowlang\glowlang.exe" run app.glow
          Pop-Location
          $out
          $want = Get-Content scripts\release-smoke.out
          if (($out -join "|") -ne ($want -join "|")) { throw "packaged glowlang gave unexpected output" }

      - uses: actions/upload-artifact@v7
        with:
          name: glowlang-${{ matrix.target }}
          path: |
            glowlang-*.tar.gz
            glowlang-*.zip
          if-no-files-found: error

      # The Microsoft Store package (docs/microsoft_store.md). It is left
      # unsigned because the Store signs it on publishing; it is kept as a
      # workflow artifact to upload to Partner Center, not attached to the
      # release (an unsigned MSIX cannot be installed directly). The identity
      # comes from the MSIX_* repository variables once the Store name is
      # reserved.
      - name: Store package (Windows)
        if: runner.os == 'Windows'
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag }}
        run: |
          # The release's version (a tag push, or the tag given to a manual
          # run); 0.0.1 only for check builds that publish nothing.
          $version = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { '0.0.1' }
          $id = @{}
          if ($env:MSIX_IDENTITY_NAME) { $id.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $id.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $id.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          if (-not $env:MSIX_PUBLISHER) { Write-Output "::warning::MSIX_PUBLISHER not set; the Store package uses a placeholder identity" }
          .\scripts\build-msix.ps1 -BinDir bin\Release -Version $version -OutFile "$env:GITHUB_WORKSPACE\store\GlowLang-x64.msix" @id

          # Unpack it and run the packaged programs the way the installed
          # package lays them out: the smoke program must find the lib\ inside.
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          $unpacked = Join-Path $env:RUNNER_TEMP msix
          & $makeappx.FullName unpack /p store\GlowLang-x64.msix /d $unpacked /o | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed" }
          $smoke = Join-Path $env:RUNNER_TEMP msix-smoke
          New-Item -ItemType Directory -Force $smoke | Out-Null
          Copy-Item scripts\release-smoke.glow "$smoke\app.glow"
          Push-Location $smoke
          $out = & "$unpacked\glowlang.exe" run app.glow
          Pop-Location
          $out
          $want = Get-Content scripts\release-smoke.out
          if (($out -join "|") -ne ($want -join "|")) { throw "packaged glowlang gave unexpected output" }
          & "$unpacked\gdu.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "packaged gdu failed" }

      - name: Upload Store package (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: store-msix-x64
          path: store/GlowLang-x64.msix
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      # Only the archives; the Store package stays a workflow artifact.
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: glowlang-*
          merge-multiple: true

      - name: Checksums
        run: cd assets && sha256sum glowlang-* > SHA256SUMS && cat SHA256SUMS

      - name: Create release in GlowLang-packages
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag }}
        run: |
          if [ -z "$TAG" ]; then echo "No tag given"; exit 1; fi
          cat > notes.md <<EOF
          GlowLang ${TAG}, built from [GlowLang-core@${GITHUB_SHA::7}](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).

          | Download | Platform |
          |---|---|
          | glowlang-windows-x64.zip | Windows 10/11, x64 |
          | glowlang-linux-x64.tar.gz | Linux x64 (glibc 2.35+, needs libX11 and libsqlite3) |
          | glowlang-macos-arm64.tar.gz | macOS, Apple silicon |
          | glowlang-macos-x64.tar.gz | macOS, Intel |

          Each archive contains \`glowlang\`, \`gdu\`, the standard library (\`lib/\`), LICENSE and NOTICE.
          Every build passed the full test suite on its platform before packaging.
          Verify downloads with SHA256SUMS. Or install with: \`gdu install glowlang\`.
          EOF
          gh release create "$TAG" assets/glowlang-* assets/SHA256SUMS \
            --repo anshumali19/GlowLang-packages \
            --title "GlowLang $TAG" \
            --notes-file notes.md
