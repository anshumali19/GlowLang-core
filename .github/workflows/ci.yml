name: GlowLang CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flex bison libfl-dev libsqlite3-dev libssl-dev libx11-dev gcc

      - name: Build GlowLang
        run: make clean && make

      - name: Run test suite
        run: ./run_all_tests.sh

      - name: Build with AddressSanitizer
        run: |
          flex -o src/lex.yy.c src/glowlang.l
          bison -Wnone -d -o src/glowlang.tab.c src/glowlang.y
          gcc src/lex.yy.c src/glowlang.tab.c src/lsp.c src/arena.c src/jit.c \
              src/opt.c src/compiler.c src/vm.c src/gc.c src/stdlib.c \
              -o bin/glowlang_asan \
              -O1 -g -lm -pthread -lssl -lcrypto -mavx2 -msse4.2 \
              -fsanitize=address -fno-omit-frame-pointer \
              -lfl -lsqlite3 -lX11

      - name: Run tests under ASan
        run: ASAN_OPTIONS=detect_leaks=0 GLOWLANG_BIN=./bin/glowlang_asan ./run_all_tests.sh

      - name: Run parser fuzzer
        run: make fuzz-parser

      - name: Cleanup
        run: rm -f src/lex.yy.c src/glowlang.tab.c src/glowlang.tab.h

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          brew update
          brew install sqlite openssl flex bison
          # Link keg-only dependencies so CMake can find them
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin" >> $GITHUB_PATH
      - name: Configure CMake
        run: cmake -B build -S . -DOPENSSL_ROOT_DIR=$(brew --prefix openssl)
      - name: Build GlowLang
        run: cmake --build build --config Release

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Flex/Bison)
        run: choco install winflexbison3
      - name: Install dependencies (vcpkg)
        run: vcpkg install openssl sqlite3:x64-windows
      - name: Configure CMake
        run: cmake -B build -S . -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows
      - name: Build GlowLang
        run: cmake --build build --config Release
